<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Ekran Paylaşımı</title>
  <link rel="stylesheet" href="../theme/theme.css" />
  <style>
    /* Tüm renkler ana pencere/Ayarlar penceresiyle AYNI --sc-* paletinden geliyor (bkz.
       picker.js applyDynamicPalette) -- burada sabit renk yalnızca önizleme görüntüsünün
       letterbox arkaplanında (#000) kullanılıyor. */
    /* GERÇEK BUG: .source-grid'in display:grid'i, tarayıcının varsayılan [hidden]{display:none}
       kuralından ÖNCELİKLİ olduğu için sekme değişiminde "hidden" verilen ızgara gizlenmiyor,
       iki ızgara alt alta birden görünüyordu (ekranlar "Uygulamalar"ın altında). */
    [hidden] {
      display: none !important;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--sc-bg-primary);
      color: var(--sc-text-normal);
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    #picker {
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 20px;
    }

    /* --- Sekmeler (Uygulamalar / Tüm Ekran) --- */
    #tabs {
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--sc-bg-tertiary);
      border-radius: 12px;
    }
    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--sc-text-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab:hover {
      color: var(--sc-text-normal);
    }
    .tab.active {
      background: var(--sc-bg-secondary);
      color: var(--sc-text-normal);
      /* Açık temada secondary/tertiary neredeyse aynı ton olduğundan aktif sekmeyi ayırt
         etmek için palet türevi ince bir halka. */
      box-shadow: 0 0 0 1px var(--sc-bg-hover);
    }
    .tab svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* --- Kaynak ızgarası --- */
    #scroll-area {
      -webkit-app-region: no-drag;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 2px 4px 2px 0;
    }
    .source-grid {
      display: grid;
      /* minmax(0, 1fr): grid hücreleri içindeki görüntünün doğal genişliğinin ALTINA
         küçülebilsin diye -- aksi halde kalın bir önizleme sütunu genişletip iki sütunu
         EŞİT olmayan boyutlara getiriyordu. */
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 16px;
    }
    .source-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
    }
    .source-thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      box-sizing: border-box;
      border: 2px solid transparent;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      transition: border-color 0.12s ease;
    }
    .source-card:hover .source-thumb-wrap {
      border-color: var(--sc-brand-hover);
    }
    .source-card.selected .source-thumb-wrap {
      border-color: var(--sc-brand);
    }
    .source-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .source-share-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      /* Karanlık temada beyaz düğme/koyu yazı, aydınlık temada tersi -- ekran görüntüsündeki
         görünümle aynı, ama sabit renk yerine palet değişkenlerinden. */
      background: var(--sc-text-normal);
      color: var(--sc-bg-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    .source-card:hover .source-share-btn,
    .source-card.selected .source-share-btn {
      opacity: 1;
      pointer-events: auto;
    }
    .source-label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0 2px;
      font-size: 14px;
      color: var(--sc-text-normal);
    }
    .source-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      object-fit: contain;
    }
    /* Monitör simgesi (SVG) soluk tonda -- uygulama simgeleri gibi renkli <img> değil. */
    .source-icon-monitor {
      color: var(--sc-text-muted);
    }
    .source-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #empty-hint {
      color: var(--sc-text-muted);
      font-size: 13px;
      text-align: center;
      padding: 32px 24px;
    }

    /* --- Kalite/FPS/Ses ayarları + İptal (bizim kendi ayarlarımız, ekran görüntüsündeki
           alt ayar çubuğu alınmadı) --- */
    #quality-bar {
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 14px;
      background: var(--sc-bg-secondary);
      border-radius: 12px;
    }
    .quality-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--sc-text-muted);
    }
    .quality-field select {
      background: var(--sc-bg-tertiary);
      color: var(--sc-text-normal);
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 12px;
    }
    .quality-field input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--sc-brand);
      cursor: pointer;
    }
    /* "Oyunum neden listede yok ?" -- soluk, altı çizili metin bağlantısı; tıklayınca uygulamanın
       diğer diyaloglarıyla AYNI modal (modal.js + theme.css .sc-modal) açılıyor. */
    #btn-missing-games {
      margin-left: 12px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--sc-text-muted);
      opacity: 0.75;
      font-family: inherit;
      font-size: 12px;
      text-decoration: underline;
      white-space: nowrap;
      cursor: pointer;
    }
    #btn-missing-games:hover {
      opacity: 1;
      color: var(--sc-text-normal);
    }
    #btn-missing-games:focus-visible {
      outline: 2px solid var(--sc-brand);
      outline-offset: 3px;
      border-radius: 2px;
    }
    /* Gövde sürükleme bölgesi olduğundan modal katmanı da sürüklenebilir sayılıp tıklamaları
       yutmasın diye. */
    .sc-modal-overlay {
      -webkit-app-region: no-drag;
    }
    #btn-cancel {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--sc-text-muted);
      color: var(--sc-text-normal);
      border-radius: 6px;
      padding: 7px 16px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    #btn-cancel:hover {
      background: var(--sc-bg-hover);
    }
  </style>
</head>
<body>
  <div id="picker">
    <div id="tabs" role="tablist">
      <button class="tab active" id="tab-windows" role="tab" data-tab="windows">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path></svg>
        Uygulamalar
      </button>
      <button class="tab" id="tab-screens" role="tab" data-tab="screens">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
        Tüm Ekran
      </button>
    </div>
    <div id="scroll-area">
      <div id="empty-hint">Yükleniyor…</div>
      <div id="grid-windows" class="source-grid" role="tabpanel" hidden></div>
      <div id="grid-screens" class="source-grid" role="tabpanel" hidden></div>
    </div>
    <div id="quality-bar">
      <div class="quality-field">
        <span>Kalite</span>
        <select id="select-quality">
          <option value="source" selected>Kaynak</option>
          <option value="1440">1440p</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="144">144p</option>
        </select>
      </div>
      <div class="quality-field">
        <span>FPS</span>
        <select id="select-fps">
          <option value="5">5</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="25">25</option>
          <option value="30">30</option>
          <option value="60" selected>60</option>
        </select>
      </div>
      <label class="quality-field">
        <input type="checkbox" id="toggle-audio" checked />
        <span>Sistem sesini paylaş</span>
      </label>
      <button id="btn-missing-games" type="button">Oyunum neden listede yok ?</button>
      <button id="btn-cancel">İptal</button>
    </div>
  </div>
  <script src="../modal.js"></script>
  <script src="picker.js"></script>
</body>
</html>
